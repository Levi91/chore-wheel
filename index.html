<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Chore Wheel</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Archivo:wght@400;500;600;700;800&display=swap">
<style>
  html, body { margin: 0; padding: 0; }
  :root {
    --bg: #eef1ec;
    --surface: #ffffff;
    --surface-2: #e6ebe3;
    --ink: #1b2321;
    --ink-soft: #5b6960;
    --border: rgba(27, 35, 33, 0.13);
    --accent: #24596b;
    --accent-ink: #ffffff;
    --accent-soft: rgba(36, 89, 107, 0.10);
    --done: #3f8f5b;
    --done-soft: rgba(63, 143, 91, 0.13);
    --danger: #a8461f;
    --shadow: 0 1px 2px rgba(20, 30, 28, 0.06), 0 10px 22px -14px rgba(20, 30, 28, 0.22);
  }

  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #101a1c;
      --surface: #182426;
      --surface-2: #1e2c2e;
      --ink: #e9efec;
      --ink-soft: #9db0a9;
      --border: rgba(233, 239, 236, 0.13);
      --accent: #75bbcd;
      --accent-ink: #0b1516;
      --accent-soft: rgba(117, 187, 205, 0.16);
      --done: #6fcb86;
      --done-soft: rgba(111, 203, 134, 0.15);
      --danger: #e08a63;
      --shadow: 0 1px 2px rgba(0, 0, 0, 0.4), 0 10px 24px -14px rgba(0, 0, 0, 0.65);
    }
  }
  :root[data-theme="dark"] {
    --bg: #101a1c;
    --surface: #182426;
    --surface-2: #1e2c2e;
    --ink: #e9efec;
    --ink-soft: #9db0a9;
    --border: rgba(233, 239, 236, 0.13);
    --accent: #75bbcd;
    --accent-ink: #0b1516;
    --accent-soft: rgba(117, 187, 205, 0.16);
    --done: #6fcb86;
    --done-soft: rgba(111, 203, 134, 0.15);
    --danger: #e08a63;
    --shadow: 0 1px 2px rgba(0, 0, 0, 0.4), 0 10px 24px -14px rgba(0, 0, 0, 0.65);
  }

  * { box-sizing: border-box; }

  body {
    background: var(--bg);
    color: var(--ink);
    font-family: 'Archivo', system-ui, sans-serif;
  }

  h1, h2, h3 { text-wrap: balance; }

  .app-shell {
    max-width: 520px;
    margin: 0 auto;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }

  .topbar {
    position: sticky;
    top: 0;
    z-index: 5;
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    padding: 22px 20px 14px;
  }

  .brand {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 10px;
  }

  .brand h1 {
    font-family: 'Fraunces', serif;
    font-weight: 700;
    font-size: 1.6rem;
    margin: 0;
    letter-spacing: -0.01em;
  }

  .today-date {
    font-size: 0.78rem;
    font-weight: 600;
    color: var(--ink-soft);
    text-transform: uppercase;
    letter-spacing: 0.07em;
    white-space: nowrap;
  }

  .tabs {
    display: flex;
    gap: 4px;
    margin-top: 16px;
    background: var(--surface-2);
    padding: 4px;
    border-radius: 12px;
  }

  .tab {
    flex: 1;
    text-align: center;
    padding: 10px 4px;
    border-radius: 9px;
    font-weight: 700;
    font-size: 0.82rem;
    color: var(--ink-soft);
    cursor: pointer;
    border: none;
    background: transparent;
    font-family: inherit;
    transition: background 0.15s ease, color 0.15s ease;
  }

  .tab.active {
    background: var(--accent);
    color: var(--accent-ink);
    box-shadow: var(--shadow);
  }

  main {
    flex: 1;
    padding: 20px 20px 40px;
  }

  .panel { display: none; }
  .panel.active { display: block; }

  /* Today */
  .chore-list {
    display: flex;
    flex-direction: column;
    gap: 12px;
  }

  .chore-card {
    display: flex;
    align-items: center;
    gap: 16px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 18px;
    box-shadow: var(--shadow);
    cursor: pointer;
    text-align: left;
    width: 100%;
    font-family: inherit;
    color: inherit;
    transition: background 0.15s ease, border-color 0.15s ease;
  }

  .chore-card.done {
    background: var(--done-soft);
    border-color: var(--done);
  }

  .chore-card .info { flex: 1; min-width: 0; }

  .kid-name {
    font-family: 'Fraunces', serif;
    font-weight: 700;
    font-size: 1.5rem;
    line-height: 1.15;
    margin: 0 0 4px;
  }

  .chore-name {
    font-weight: 600;
    font-size: 1.02rem;
    color: var(--ink-soft);
  }

  .chore-card.done .chore-name {
    text-decoration: line-through;
    color: var(--done);
  }

  .done-at {
    display: block;
    font-size: 0.82rem;
    font-weight: 600;
    color: var(--done);
    margin-top: 4px;
  }

  .check-circle {
    width: 38px;
    height: 38px;
    border-radius: 50%;
    border: 2px solid var(--border);
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--surface);
    transition: background 0.15s ease, border-color 0.15s ease;
  }

  .chore-card.done .check-circle {
    background: var(--done);
    border-color: var(--done);
  }

  .check-circle svg {
    width: 20px;
    height: 20px;
    opacity: 0;
    transform: scale(0.7);
    transition: opacity 0.12s ease, transform 0.12s ease;
  }

  .chore-card.done .check-circle svg {
    opacity: 1;
    transform: scale(1);
  }

  .empty-state {
    background: var(--surface);
    border: 1px dashed var(--border);
    border-radius: 16px;
    padding: 32px 24px;
    text-align: center;
    color: var(--ink-soft);
  }

  .empty-state p { margin: 0 0 16px; font-size: 0.98rem; }

  .btn {
    display: inline-block;
    padding: 11px 20px;
    border-radius: 10px;
    border: none;
    background: var(--accent);
    color: var(--accent-ink);
    font-weight: 700;
    font-size: 0.9rem;
    font-family: inherit;
    cursor: pointer;
  }

  /* History */
  .day-block { margin-bottom: 22px; }

  .day-header {
    font-weight: 700;
    font-size: 0.8rem;
    text-transform: uppercase;
    letter-spacing: 0.07em;
    color: var(--ink-soft);
    margin-bottom: 8px;
  }

  .day-rows {
    display: flex;
    flex-direction: column;
    gap: 8px;
  }

  .day-row {
    display: flex;
    align-items: center;
    gap: 12px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 11px 14px;
    font-size: 0.92rem;
  }

  .day-row .dot {
    width: 18px;
    height: 18px;
    border-radius: 50%;
    border: 2px solid var(--border);
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--surface-2);
  }

  .day-row.done .dot {
    background: var(--done);
    border-color: var(--done);
  }

  .day-row .dot svg { width: 11px; height: 11px; opacity: 0; }
  .day-row.done .dot svg { opacity: 1; }

  .day-row .who { font-weight: 700; }
  .day-row .what { color: var(--ink-soft); }
  .day-row.done .what { color: var(--done); }
  .day-row .when {
    margin-left: auto;
    font-size: 0.8rem;
    font-weight: 600;
    color: var(--done);
    white-space: nowrap;
  }

  .day-empty {
    font-size: 0.88rem;
    color: var(--ink-soft);
    font-style: italic;
    padding: 4px 2px;
  }

  /* Edit */
  .edit-section { margin-bottom: 28px; }

  .edit-section h2 {
    font-family: 'Fraunces', serif;
    font-size: 1.15rem;
    font-weight: 600;
    margin: 0 0 12px;
  }

  .edit-list {
    display: flex;
    flex-direction: column;
    gap: 8px;
    margin-bottom: 10px;
  }

  .edit-item {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 10px 8px 10px 14px;
    font-weight: 600;
  }

  .edit-item button {
    background: none;
    border: none;
    color: var(--ink-soft);
    font-size: 1rem;
    line-height: 1;
    cursor: pointer;
    padding: 8px 10px;
    border-radius: 8px;
    font-family: inherit;
  }

  .edit-item button:hover { background: var(--surface-2); color: var(--danger); }

  .add-row { display: flex; gap: 8px; }

  .add-row input[type="text"] {
    flex: 1;
    min-width: 0;
    padding: 11px 13px;
    border-radius: 10px;
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--ink);
    font-family: inherit;
    font-size: 0.95rem;
  }

  .add-row button {
    padding: 0 18px;
    border-radius: 10px;
    border: none;
    background: var(--accent);
    color: var(--accent-ink);
    font-weight: 700;
    font-family: inherit;
    cursor: pointer;
  }

  .list-empty {
    font-size: 0.88rem;
    color: var(--ink-soft);
    font-style: italic;
    padding: 4px 2px 10px;
  }

  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  @media (prefers-reduced-motion: reduce) {
    * { transition: none !important; }
  }
</style>
</head>
<body>

<div class="app-shell">
  <div class="topbar">
    <div class="brand">
      <h1>Chore Wheel</h1>
      <span class="today-date" id="todayDate"></span>
    </div>
    <div class="tabs" role="tablist">
      <button class="tab active" data-tab="today" role="tab">Today</button>
      <button class="tab" data-tab="history" role="tab">History</button>
      <button class="tab" data-tab="edit" role="tab">Edit</button>
    </div>
  </div>

  <main>
    <section class="panel active" id="panel-today">
      <div class="chore-list" id="todayList"></div>
    </section>

    <section class="panel" id="panel-history">
      <div id="historyList"></div>
    </section>

    <section class="panel" id="panel-edit">
      <div class="edit-section">
        <h2>Family members</h2>
        <div class="edit-list" id="kidsList"></div>
        <form class="add-row" id="addKidForm">
          <input type="text" id="addKidInput" placeholder="Add a family member" maxlength="30" autocomplete="off">
          <button type="submit">Add</button>
        </form>
      </div>

      <div class="edit-section">
        <h2>Chores</h2>
        <div class="edit-list" id="choresList"></div>
        <form class="add-row" id="addChoreForm">
          <input type="text" id="addChoreInput" placeholder="Add a chore" maxlength="40" autocomplete="off">
          <button type="submit">Add</button>
        </form>
      </div>
    </section>
  </main>
</div>

<script>
(function () {
  var STORAGE_KEY = 'choreWheel.v1';
  var CHECK_ICON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg>';

  function uid() { return 'id_' + Math.random().toString(36).slice(2, 9); }

  function loadState() {
    try {
      var raw = localStorage.getItem(STORAGE_KEY);
      if (raw) {
        var parsed = JSON.parse(raw);
        if (parsed && parsed.kids && parsed.chores && parsed.log) return parsed;
      }
    } catch (e) {}
    return {
      kids: [],
      chores: [
        { id: uid(), name: 'Sweeping' },
        { id: uid(), name: 'Clearing the table' },
        { id: uid(), name: 'Clearing the counter' }
      ],
      log: {}
    };
  }

  function saveState() {
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); } catch (e) {}
  }

  function dateKey(d) {
    var y = d.getFullYear(), m = String(d.getMonth() + 1).padStart(2, '0'), day = String(d.getDate()).padStart(2, '0');
    return y + '-' + m + '-' + day;
  }

  function dayNumber(d) {
    return Math.floor(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()) / 86400000);
  }

  function formatTime(iso) {
    return new Intl.DateTimeFormat(undefined, { hour: 'numeric', minute: '2-digit' }).format(new Date(iso));
  }

  function generateAssignment(date) {
    var kids = state.kids, chores = state.chores;
    if (!kids.length || !chores.length) return [];
    var offset = dayNumber(date) % chores.length;
    return kids.map(function (kid, i) {
      var chore = chores[(i + offset) % chores.length];
      return { kidId: kid.id, kidName: kid.name, choreId: chore.id, choreName: chore.name, done: false, doneAt: null };
    });
  }

  function ensureToday() {
    var key = dateKey(new Date());
    var prev = state.log[key];
    var fresh = generateAssignment(new Date());
    if (prev) {
      var stateByKid = {};
      prev.assignments.forEach(function (a) { stateByKid[a.kidId] = { done: a.done, doneAt: a.doneAt || null }; });
      fresh.forEach(function (a) {
        if (stateByKid.hasOwnProperty(a.kidId)) {
          a.done = stateByKid[a.kidId].done;
          a.doneAt = stateByKid[a.kidId].doneAt;
        }
      });
    }
    state.log[key] = { assignments: fresh };
    saveState();
    return state.log[key];
  }

  var state = loadState();

  // ---------- Tabs ----------
  var tabs = document.querySelectorAll('.tab');
  var panels = {
    today: document.getElementById('panel-today'),
    history: document.getElementById('panel-history'),
    edit: document.getElementById('panel-edit')
  };
  tabs.forEach(function (tab) {
    tab.addEventListener('click', function () {
      tabs.forEach(function (t) { t.classList.remove('active'); });
      tab.classList.add('active');
      Object.keys(panels).forEach(function (k) { panels[k].classList.remove('active'); });
      panels[tab.dataset.tab].classList.add('active');
      if (tab.dataset.tab === 'history') renderHistory();
    });
  });

  function goToEdit() {
    tabs.forEach(function (t) { t.classList.toggle('active', t.dataset.tab === 'edit'); });
    Object.keys(panels).forEach(function (k) { panels[k].classList.toggle('active', k === 'edit'); });
  }

  // ---------- Today ----------
  function renderToday() {
    var entry = ensureToday();
    var list = document.getElementById('todayList');
    var assignments = entry.assignments;

    if (!state.kids.length || !state.chores.length) {
      var missing = !state.kids.length && !state.chores.length
        ? 'family members and chores'
        : (!state.kids.length ? 'family members' : 'chores');
      list.innerHTML =
        '<div class="empty-state"><p>Add ' + missing + ' to get started.</p>' +
        '<button class="btn" id="emptyEditBtn">Go to Edit</button></div>';
      document.getElementById('emptyEditBtn').addEventListener('click', goToEdit);
      return;
    }

    list.innerHTML = assignments.map(function (a) {
      return (
        '<button class="chore-card' + (a.done ? ' done' : '') + '" data-kid="' + a.kidId + '">' +
          '<span class="info">' +
            '<p class="kid-name">' + escapeHtml(a.kidName) + '</p>' +
            '<span class="chore-name">' + escapeHtml(a.choreName) + '</span>' +
            (a.done && a.doneAt ? '<span class="done-at">Done at ' + formatTime(a.doneAt) + '</span>' : '') +
          '</span>' +
          '<span class="check-circle">' + CHECK_ICON + '</span>' +
        '</button>'
      );
    }).join('');

    list.querySelectorAll('.chore-card').forEach(function (card) {
      card.addEventListener('click', function () {
        var kidId = card.dataset.kid;
        var a = entry.assignments.find(function (x) { return x.kidId === kidId; });
        if (a) {
          a.done = !a.done;
          a.doneAt = a.done ? new Date().toISOString() : null;
          saveState();
          renderToday();
        }
      });
    });
  }

  // ---------- History ----------
  function renderHistory() {
    var container = document.getElementById('historyList');
    var today = new Date();
    var blocks = [];
    for (var i = 0; i < 7; i++) {
      var d = new Date(today);
      d.setDate(d.getDate() - i);
      var key = dateKey(d);
      var entry = state.log[key];
      var label = i === 0 ? 'Today' : i === 1 ? 'Yesterday' :
        new Intl.DateTimeFormat(undefined, { weekday: 'long', month: 'short', day: 'numeric' }).format(d);

      var rowsHtml;
      if (!entry || !entry.assignments.length) {
        rowsHtml = '<div class="day-empty">No record for this day.</div>';
      } else {
        rowsHtml = '<div class="day-rows">' + entry.assignments.map(function (a) {
          return (
            '<div class="day-row' + (a.done ? ' done' : '') + '">' +
              '<span class="dot">' + CHECK_ICON + '</span>' +
              '<span class="who">' + escapeHtml(a.kidName) + '</span>' +
              '<span class="what">' + escapeHtml(a.choreName) + '</span>' +
              (a.done && a.doneAt ? '<span class="when">' + formatTime(a.doneAt) + '</span>' : '') +
            '</div>'
          );
        }).join('') + '</div>';
      }

      blocks.push(
        '<div class="day-block"><div class="day-header">' + label + '</div>' + rowsHtml + '</div>'
      );
    }
    container.innerHTML = blocks.join('');
  }

  // ---------- Edit ----------
  function renderEdit() {
    var kidsList = document.getElementById('kidsList');
    var choresList = document.getElementById('choresList');

    kidsList.innerHTML = state.kids.length
      ? state.kids.map(function (k) {
          return '<div class="edit-item"><span>' + escapeHtml(k.name) + '</span><button data-id="' + k.id + '" aria-label="Remove ' + escapeHtml(k.name) + '">&times;</button></div>';
        }).join('')
      : '<div class="list-empty">No family members yet.</div>';

    choresList.innerHTML = state.chores.length
      ? state.chores.map(function (c) {
          return '<div class="edit-item"><span>' + escapeHtml(c.name) + '</span><button data-id="' + c.id + '" aria-label="Remove ' + escapeHtml(c.name) + '">&times;</button></div>';
        }).join('')
      : '<div class="list-empty">No chores yet.</div>';

    kidsList.querySelectorAll('button').forEach(function (btn) {
      btn.addEventListener('click', function () {
        state.kids = state.kids.filter(function (k) { return k.id !== btn.dataset.id; });
        saveState();
        renderEdit();
      });
    });

    choresList.querySelectorAll('button').forEach(function (btn) {
      btn.addEventListener('click', function () {
        state.chores = state.chores.filter(function (c) { return c.id !== btn.dataset.id; });
        saveState();
        renderEdit();
      });
    });
  }

  document.getElementById('addKidForm').addEventListener('submit', function (e) {
    e.preventDefault();
    var input = document.getElementById('addKidInput');
    var name = input.value.trim();
    if (!name) return;
    state.kids.push({ id: uid(), name: name });
    saveState();
    input.value = '';
    renderEdit();
    renderToday();
  });

  document.getElementById('addChoreForm').addEventListener('submit', function (e) {
    e.preventDefault();
    var input = document.getElementById('addChoreInput');
    var name = input.value.trim();
    if (!name) return;
    state.chores.push({ id: uid(), name: name });
    saveState();
    input.value = '';
    renderEdit();
    renderToday();
  });

  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }

  document.getElementById('todayDate').textContent =
    new Intl.DateTimeFormat(undefined, { weekday: 'short', month: 'short', day: 'numeric' }).format(new Date());

  renderToday();
  renderEdit();
})();
</script>
</body>
</html>
